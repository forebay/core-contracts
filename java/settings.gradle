plugins {
    id "org.gradle.toolchains.foojay-resolver-convention" version "0.8.0"
}

rootProject.name = "core-contracts-java"

// :annotations, :processor and :contract come from the api submodule (../api/java from here).
// Gradle settings do not nest, so a consumer re-declares the modules its submodules provide; the
// project path is preserved and only projectDir differs, which is the ecosystem convention.
include ":annotations"
project(":annotations").projectDir = file("../api/java/annotations")
include ":processor"
project(":processor").projectDir = file("../api/java/processor")
include ":contract"
project(":contract").projectDir = file("../api/java/contract")

// :contracts - the capability, service and event vocabulary a host consumes and a plugin provides.
include ":contracts"
